name: Deploy Web Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web-demo/**'
      - 'Cargo.toml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build WebAssembly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: |
          wasm-pack build --dev --target web --out-dir web-demo/pkg-web -- --features web

      - name: Compress FST files for web
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          # Compress the FST files for faster loading
          brotli -q 11 data/suffix.fst -o data/suffix.fst.br
          brotli -q 11 data/prefix.fst -o data/prefix.fst.br
          brotli -q 11 data/infix.fst -o data/infix.fst.br

      - name: Create pages directory structure
        run: |
          mkdir -p pages/data
          mkdir -p pages/web-demo/pkg-web
          mkdir -p pages/web-demo

      - name: Copy web demo files
        run: |
          # Copy index.html and update paths for GitHub Pages
          sed 's|./pkg-web/|./web-demo/pkg-web/|g; s|../data/|./data/|g' web-demo/index.html > pages/index.html
          # Copy other files
          cp web-demo/style.css pages/
          cp -r web-demo/pkg-web pages/web-demo/

      - name: Copy FST data files
        run: |
          cp data/suffix.fst pages/data/
          cp data/prefix.fst pages/data/
          cp data/infix.fst pages/data/
          cp data/suffix.fst.br pages/data/
          cp data/prefix.fst.br pages/data/
          cp data/infix.fst.br pages/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
