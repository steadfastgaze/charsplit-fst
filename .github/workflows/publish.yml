name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (Linux only)
        if: ${{ contains(matrix.os, 'ubuntu') }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: cibuildwheel
        env:
          CIBW_PLATFORM: ${{ contains(matrix.os, 'ubuntu') && 'linux' || contains(matrix.os, 'macos') && 'macos' || 'windows' }}
          CIBW_ENVIRONMENT: 'MATURIN_FEATURES="python embed-data" PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_BEFORE_ALL_LINUX: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_BEFORE_ALL_MACOS: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_BEFORE_ALL_WINDOWS: rustup target add x86_64-pc-windows-msvc

          # macOS arm64-only wheel; set the minimum version explicitly.
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET="11.0"'

          # Build selected arch wheels across platforms
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          # Keep macOS arm64 only (Apple Silicon). Dropping Intel macOS.
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_wheels_freebsd:
    name: Build wheels on FreeBSD (default release)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          arch: ${{ matrix.arch }}
          run: |
            set -eux
            # FreeBSD packages vary by release; avoid depending on py312-pip/cargo package names.
            pkg install -y python312 rust

            PY=python3.12
            command -v "$PY" >/dev/null 2>&1 || PY=python3

            # Ensure pip exists, then upgrade it.
            "$PY" -m ensurepip --upgrade || true
            "$PY" -m pip install -U pip
            "$PY" -m pip install "maturin>=1.0,<2.0"
            # Build a single stable-ABI wheel for this FreeBSD arch.
            "$PY" -m maturin build --release --compatibility abi3 --features "python embed-data" -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-freebsd-${{ matrix.arch }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_wheels_freebsd]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/charsplit-fst
    permissions:
      id-token: write  # trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Build source distribution
        run: |
          pip install maturin
          # sdist fallback for platforms we don't ship wheels for.
          maturin sdist -o dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
