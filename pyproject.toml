[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "charsplit-fst"
version = "0.1.2"
description = "German compound word splitter using Rust + FST"
license = "MIT OR Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]

[tool.maturin]
features = ["python", "embed-data"]
module-name = "charsplit_fst"

[tool.cibuildwheel]
# Skip 32-bit builds
skip = "*-musllinux_*i686 *-win32 *-manylinux_i686"

# Build Python 3.12+ versions
build = "cp312-* cp313-*"

# Enable maturin with python and embed-data features
environment = { MATURIN_FEATURES="python embed-data" }
