<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Compound Word Splitter - WASM Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>German Compound Word Splitter</h1>
        <p>This demo uses a Rust-based algorithm compiled to WebAssembly for fast German compound word splitting.</p>

        <input type="text" id="word-input" placeholder="Enter a German compound word (e.g. Autobahnraststätte)..." />

        <div id="status" class="status">Loading WASM module...</div>
        <div id="results"></div>
    </div>

    <script type="module">
        let splitter = null;
        const wordInput = document.getElementById('word-input');
        const resultsDiv = document.getElementById('results');
        const statusDiv = document.getElementById('status');

        // Initialize the app when the page loads
        window.onload = async function() {
            try {
                const init = await import('./pkg-web/charsplit_fst.js');
                await init.default();

                statusDiv.textContent = 'Loading FST data files...';

                // Helper function to decompress Brotli data with cross-browser compatibility
                async function loadFstData(filename) {
                    // Check if DecompressionStream is supported
                    if (!('DecompressionStream' in window)) {
                        // Fallback to uncompressed file if DecompressionStream not supported
                        const response = await fetch(`./data/${filename}`);
                        return await response.arrayBuffer();
                    }
                    
                    // Try to load the Brotli-compressed version first
                    try {
                        const response = await fetch(`./data/${filename}.br`);
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        
                        // Try different Brotli format names depending on browser
                        let format = 'br'; // Standard name
                        let stream;
                        
                        try {
                            stream = new DecompressionStream(format);
                        } catch(e) {
                            // If 'br' fails, try 'brotli' (for Safari)
                            try {
                                format = 'brotli';
                                stream = new DecompressionStream(format);
                            } catch(e2) {
                                // If both fail, fall back to uncompressed
                                console.warn(`Compression format not supported, falling back to uncompressed file for ${filename}`);
                                const fallbackResponse = await fetch(`./data/${filename}`);
                                return await fallbackResponse.arrayBuffer();
                            }
                        }
                        
                        const decompressedStream = response.body.pipeThrough(stream);
                        const decompressedResponse = new Response(decompressedStream);
                        return await decompressedResponse.arrayBuffer();
                    } catch (error) {
                        console.warn(`Failed to load compressed ${filename}.br, trying uncompressed...`, error);
                        // If compressed failed, try the uncompressed version
                        const fallbackResponse = await fetch(`./data/${filename}`);
                        return await fallbackResponse.arrayBuffer();
                    }
                }

                // Load the FST data files (try compressed first, fall back to uncompressed)
                const [suffixData, prefixData, infixData] = await Promise.all([
                    loadFstData('suffix.fst'),
                    loadFstData('prefix.fst'),
                    loadFstData('infix.fst')
                ]);

                // Create the splitter instance
                splitter = new init.WebSplitter(
                    new Uint8Array(suffixData),
                    new Uint8Array(prefixData),
                    new Uint8Array(infixData)
                );

                statusDiv.textContent = 'Ready!';
                
                // Set default word and trigger initial split
                wordInput.value = 'Autobahnraststätte';
                splitWord();

                // Add event listener for live splitting
                wordInput.addEventListener('input', splitWord);

            } catch (error) {
                statusDiv.innerHTML = `<div class="error">Error loading WASM module: ${error.message}</div>`;
            }
        };

        async function splitWord() {
            if (!splitter) return;

            const word = wordInput.value.trim();
            if (!word) {
                resultsDiv.innerHTML = '';
                return;
            }

            try {
                const results = splitter.split_compound(word);
                displayResults(results, word);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error splitting word: ${error.message}</div>`;
            }
        }

        function displayResults(results, originalWord) {
            if (!results || results.length === 0) {
                resultsDiv.innerHTML = '<p>No splits found for this word.</p>';
                return;
            }

            let html = `<h3>Results for "${originalWord}":</h3><ol>`;

            // Display up to 10 results
            for (let i = 0; i < Math.min(results.length, 10); i++) {
                const result = results[i];
                html += `
                    <li class="result-item">
                        <span class="result-score">${result.score.toFixed(3)}</span>
                        <span class="result-parts">${result.part1} + ${result.part2}</span>
                    </li>
                `;
            }

            html += '</ol>';

            if (results.length > 10) {
                html += `<p><em>Showing top 10 of ${results.length} results</em></p>`;
            }

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
